[Paths]
# 训练数据文件路径（CSV 格式），用于训练 AutoML 模型
train_file = ../sample/train_samples_2_Atest.csv
# 测试数据文件路径（CSV 格式），用于进行预测验证
test_file = ../sample/test_samples_2_Atest.csv
# 特征重要性输出路径（CSV 格式），保存按重要性排序的特征列表
output_feature_importance = ../out/feature_importance.csv
# 预测结果输出路径（CSV 格式），包括 hdd_id, date, bad_sectors, predict
output_prediction_file = ../out/predictions_automl.csv
# 训练后模型文件保存目录（模型将保存在h2o/model_save_path目录下）
model_save_path = models
[Columns]
# 目标列（即要预测的字段，一般为剩余寿命等）
target_column = remaining_life_days
# 唯一标识硬盘记录的字段名，用逗号分隔
id_columns = device_id,date
[Automl]
# 训练的最大模型数量，控制 AutoML 搜索规模
max_models = 10
# 训练的最大运行时间（单位：秒），限制整体训练耗时
max_runtime_secs = 300
