# =======================================================================
# H2O 硬盘坏道预测项目统一配置文件 (h2o_run.ini)
# 供 gentrainsamps.py, train-automl.py, predictor.py, h2o_run.py 共同使用
# =======================================================================
[Title]
# 菜单标题标签
label = 坏道

[Base_Path] 
# ===== 原始数据输入路径 (供 gentrainsamps.py 使用) =====
# 原始训练数据输入路径
raw_train_input_path = data/base_samples_2.csv 

# 原始测试数据输入路径
raw_test_input_path = data/test_samples_base_2.csv

[Sample_Path]
# ===== 样本生成/训练输入路径 (供 gentrainsamps.py 输出, train-automl.py 输入) =====
# 样本制作输入路径 (即训练模型的输入文件路径)
train_sample_path = sample/train_samples_2.csv 

# 测试样本输入路径 (即预测模型的输入文件路径)
test_sample_path = sample/test_samples_2.csv  

[After_Train_Path]
# ===== 模型/预测输出路径 (供 train-automl.py / predictor.py 使用) =====
# 训练/测试样本信息统计表输出路径
static_path = out/dataset_statistics.csv      

# 预测结果输出路径
prediction_path = out/predictions_automl.csv  

# 特征重要性输出路径
feature_importance_path = out/feature_importance.csv      

# 训练后模型文件保存目录
model_save_dir = models 

[App_Path]
# 应用接口输入文件路径
app_input_path = app/input/test3_poh.csv

# 应用接口输出文件路径
app_out_path = app/out/predictions_automl.csv 

[Features]
# 设备ID字段名 （唯一表示设备，例如：硬盘的标识符）
device_id = device_id

# 日期字段名
date = date

# 设备ID + 日期 说明：唯一确定样本的每一个记录，等同于早先版本的 id_columns

# 关键监控字段名（例如：硬盘坏道数量，或其他如：）。
# 注意：对于硬盘坏道，不要轻易修改本字段名，否则将无法打印样本特征统计。
key_field = bad_sectors

# 训练样本目标列名（即要预测的字段）
target = target

# 设备ID + 日期 + 关键监控字段 说明：等同于早先版本需要的字段栏 columns_to_keep。

# 训练测试样本目标名
predict = predict

# 预测趋势特征 0：单调增长 1 波动趋势
trend_feature = 0

[Make_Train_Sample]
# ===== 核心模式控制（供 h2o_run.py 动态修改） =====
# 训练模式：A / B / C
# A → 预测达到坏道阈值点所需天数
# B → 预测达到未来天数时的日期坏道数量
mode = A

# 生成训练样本或测试样本： true：生成测试样本，false：生成训练样本
if_test = false

# A 方案：
# 滞后特征：单位：天数
lag_days_A = 5, 7, 9

# 硬盘失效阈值：坏道达到下列值视为硬盘失效。
fail_threshold_A = 34

# B 方案
# 滞后特征：单位：天数
lag_days_B = 1, 3, 7

# 目标特征 未来 5 天的坏道数量
horizon_days_B = 1000

# 滑动窗口定义了计算短期恶化趋势（斜率）所回顾的历史天数。
slope_window_B = 7

[Train_Automl]
# ===== 训练配置 =====
# 是否清空输出文件（保证输出文件目录只保存当前最新文件） 清空0，不清空1
if_clean = 1

# H2O 训练的最大模型数量，控制 AutoML 搜索规模
max_models = 10

# H2O 训练的最大运行时间（单位：秒），限制整体训练耗时
max_runtime_secs = 600

[App_predictor]
# 应用预测时最大内存，推荐服务器内存的50-60%
h2o_max_mem = 10G
